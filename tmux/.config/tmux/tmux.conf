# ==========================
# Core Settings
# ==========================
# Set Prefix to Ctrl+f
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# CRUCIAL FOR NEOVIM: Remove escape delay
set -s escape-time 0

# Show status messages for 3 seconds (default is 750ms)
set -g display-time 3000

# Enable True Color and 256 colors for beautiful Nvim themes
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable Mouse support
set -g mouse on

# Increase scrollback buffer size
set -g history-limit 50000

# 1-based indexing for easier reaching
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable focus events for Neovim's 'autoread'
set-option -g focus-events on

# ==========================
# Keybindings
# ==========================
# Easy config reload (Prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config reloaded!"

# Navigation
# Cycle through windows
bind -n M-h previous-window
bind -n M-l next-window

# Jump to window by number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# New window in current directory
bind -n M-t new-window -c "#{pane_current_path}"

# Close window without confirm
bind -n M-w kill-window

# Move window left/right (Shift+Alt+h/l mirrors the cycle keys)
bind -n M-H swap-window -t -1 \; previous-window
bind -n M-L swap-window -t +1 \; next-window

# Last window (prefix+Tab — avoids M-Tab system conflict)
bind Tab last-window

# Rename window
bind -n M-r command-prompt "rename-window '%%'"

# Better Splitting (Visual and intuitive)
unbind '"'
unbind %
# Prefix + | for vertical split
bind | split-window -h -c "#{pane_current_path}"
# Prefix + - for horizontal split
bind - split-window -v -c "#{pane_current_path}"
# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Resizing panes (Prefix + Shift + hjkl)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Maximize pane (Prefix + m instead of Prefix + z, personal preference for "maximize")
bind -r m resize-pane -Z

# ==========================
# Vi Copy Mode
# ==========================
set-window-option -g mode-keys vi

# Enter "Navigation / Copy Mode" with Prefix + Escape (Default is Prefix + [)
bind Escape copy-mode

# Enter "Visual Mode" with just 'v' (Once in copy mode)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Enter "Visual Line Mode" with 'V' (Shift + v)
bind-key -T copy-mode-vi 'V' send-keys -X select-line

# Exit copy mode with Escape (default only clears selection, doesn't exit)
bind-key -T copy-mode-vi 'Escape' send-keys -X cancel

# Copy to the system clipboard. copy-pipe without a command (y below, and the
# default mouse drag binding) pipes the selection into copy-command.
set -s copy-command 'wl-copy'

# Yank with 'y' and clear the selection, but stay in copy mode
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe \; send-keys -X clear-selection

# Prefix + p to paste from the system clipboard
bind p run-shell "wl-paste -n | tmux load-buffer - ; tmux paste-buffer"

# ==========================
# Mouse selection
# ==========================
# tmux owns the mouse (mouse on above): WezTerm forwards all mouse events
# here, and tmux passes them on to programs that request them (nvim with
# mouse=a). Hold Shift to select with WezTerm instead.
#
# The defaults wait 0.3s after a double/triple click before copying
# (run-shell -d 0.3) and always leave copy mode after a copy, jumping back
# to the bottom. Instead, copy immediately and:
#   - at the bottom (normal use): copy and leave copy mode right away
#   - scrolled up in copy mode:   copy, keep the highlight and stay where you
#                                 are; the next click clears the highlight
# scroll_position is 0 (false) when copy mode shows the bottom of the history.

# Double/triple click outside copy mode: select word/line, copy, done.
# Clicks go to the program instead if the pane is in a mode or the program
# requested the mouse (mouse_any_flag, e.g. nvim).
bind -T root DoubleClick1Pane select-pane -t = \; \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } \
    { copy-mode -H ; send-keys -X select-word ; send-keys -X copy-pipe-and-cancel }
bind -T root TripleClick1Pane select-pane -t = \; \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } \
    { copy-mode -H ; send-keys -X select-line ; send-keys -X copy-pipe-and-cancel }

# Inside copy mode (a drag also enters copy mode first)
bind -T copy-mode-vi MouseDragEnd1Pane \
    if -F "#{scroll_position}" { send-keys -X copy-pipe-no-clear } { send-keys -X copy-pipe-and-cancel }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; \
    if -F "#{scroll_position}" { send-keys -X copy-pipe-no-clear } { send-keys -X copy-pipe-and-cancel }
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; \
    if -F "#{scroll_position}" { send-keys -X copy-pipe-no-clear } { send-keys -X copy-pipe-and-cancel }
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# ==========================
# UI & Status Bar (Clean & Minimal)
# ==========================
# Move the status bar to the top of the terminal
set-option -g status-position top

# Base status bar colors (transparent background, default text)
set -g status-style bg=default,fg="#c0caf5"

# Left side: Session name (Tokyo Night Blue)
set -g status-left-length 50
set -g status-left "#[fg=#7aa2f7,bold] ❐ #S #[default]  "

# Right side: Time (Tokyo Night Muted Grey)
set -g status-right "#[fg=#565f89]%H:%M #[default] "

# Inactive Window: Muted grey text
set -g window-status-format "#[fg=#565f89] #I:#W "

# Active Window: Tokyo Night Purple (Bold) - No asterisk!
set -g window-status-current-format "#[fg=#e0af68,bold] #I:#W "

# ==========================
# Seamless Nvim/Tmux navigation
# ==========================
# tmux side of christoomey/vim-tmux-navigator (the Neovim plugin handles the
# other side): Ctrl+hjkl moves between panes, or is passed through to Neovim
# when the current pane runs it.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
